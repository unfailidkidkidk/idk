<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f7fb">
  <title>Download the presentation</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #202431;
      background: #f6f7fb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      place-items: center;
    }

    main {
      width: min(100%, 440px);
      padding: 40px;
      border: 1px solid #e8eaf1;
      border-radius: 24px;
      background: #fff;
      box-shadow: 0 20px 60px rgb(33 42 72 / 9%);
      text-align: center;
    }

    .icon {
      display: grid;
      width: 64px;
      height: 64px;
      margin: 0 auto 24px;
      border-radius: 18px;
      background: #fff2e8;
      color: #e87528;
      font-size: 30px;
      place-items: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(24px, 6vw, 30px);
      letter-spacing: -0.04em;
    }

    p {
      margin: 12px 0 28px;
      color: #707687;
      line-height: 1.6;
    }

    .download {
      display: inline-flex;
      width: 100%;
      min-height: 52px;
      align-items: center;
      justify-content: center;
      gap: 10px;
      border-radius: 12px;
      background: #e87528;
      color: #fff;
      font-weight: 650;
      text-decoration: none;
      transition: background 150ms ease, transform 150ms ease;
    }

    .download:hover {
      transform: translateY(-1px);
      background: #d9651b;
    }

    .download:focus-visible {
      outline: 3px solid #f4b58a;
      outline-offset: 3px;
    }

    .filename {
      display: block;
      margin-top: 18px;
      color: #9298a6;
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    @media (max-width: 480px) {
      main {
        padding: 32px 24px;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true">↓</div>
    <h1>Your presentation is ready</h1>
    <p>Click below to download the PowerPoint file.</p>
    <a
      class="download"
      href="https://unfailidkidkidk.github.io/idk/N%C4%83ng%20l%C6%B0%E1%BB%A3ng%20m%E1%BA%B7t%20tr%E1%BB%9Di.pptx"
      download="Năng lượng mặt trời.pptx"
    >
      <span aria-hidden="true">↓</span>
      Download presentation
    </a>
    <span class="filename">Năng lượng mặt trời.pptx</span>
  </main>
</body>
</html>
